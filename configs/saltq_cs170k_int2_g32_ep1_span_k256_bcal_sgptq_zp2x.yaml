# =============================================================================
# SALT-Q — INT2 g32, k=256, span, bcal + salient_init=gptq, zp_lr x2   (ONE VARIABLE: zp_lr)
#
# Derived from configs/saltq_cs170k_int2_g32_ep1_span_k256_bcal_sgptq.yaml (73.91). The only
# change: zp_lr_by_bits[2] 1.73e-3 -> 3.46e-3. Same permuted base AND the same frozen-code base
# (reused via --saltq_base_dir), so the codes, the salient start and the LSQ grids are literally
# identical; only the non-salient zero-point step size differs.
#
# Why: at the bracketed rates the three k=256 runs all move the non-salient zero-points by
# |dz| p50 0.029 / p90 0.073 levels (scripts/measure_saltq_displacement.py), while the QA-LoRA
# adapter that scores 72.96 is an equivalent zp shift of p50 0.041 / p90 0.125 levels (16% of
# (row, group) cells beyond 0.1). The earlier 2.5x arm (66.24 vs 67.29) raised salient_lr and
# zp_lr together and the salient half is known to hurt, so a zp-only increase was never tested.
# Expected effect <= 1 point; read against 73.91 with the +/-0.5 single-seed resolution in mind.
# =============================================================================

model:
  name: "meta-llama/Llama-2-7b-hf"
  # Overridden by `run_saltq.sh --bits N` / `--bits`. INT3 g64 ran first because that cell has a
  # full external baseline (PSQAT+GPTQ 42.6, LR-QAT/fp16 45.2) — it came back at 44.8, so the
  # machinery is sound. INT2 (where GPTQ-only non-salient collapses, and the method's actual
  # target regime) runs with EVERY other field below unchanged, so it is single-variable.
  quant_bits: 2
  # double_quant / quant_type are NF4 knobs and are UNUSED by SALT-Q (there is no bitsandbytes in
  # this path at all — the base is real INT-b GPTQ codes, so there is no double quantization).
  double_quant: true
  quant_type: "nf4"
  dtype: "bfloat16"
  max_seq_len: 2048

lora:
  rank: 64                  # UNUSED by SALT-Q (no adapter). Kept so shared config readers/loggers
  alpha: 16                 # and the r=64 parameter-budget comparison stay meaningful.
  dropout: 0.0
  # target_modules selects which linears become SALTQLinear.
  #   q/k/v/gate/up_proj : residual-stream P_k permute  -> salient slice [0:layer_group_k)
  #   down_proj          : block-internal P4_l permute  -> its own per-layer group_k
  #   o_proj             : per-head Hadamard only, group_k = 0
  #                        -> in SALT-Q it is NOT untrainable any more: it becomes pure
  #                           frozen-codes + trainable (s, z) over ALL its columns.
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"

qat:
  mode: "saltq"
  # MUST be asymmetric. The affine (q - z) * s convention is exactly what GPTQ/AWQ checkpoints
  # store, so the trained (s, z) drop into the existing metadata slots with no format change.
  # (At 2 bit it is doubly forced: the symmetric grid has 3 usable levels {-1,0,1} vs 4 affine.)
  symmetric: false
  # group_k is always a multiple of this, so the salient columns occupy COMPLETE quantization
  # groups starting at column 0. group_size also sets the DENSITY of the non-salient segment's
  # affine freedom: (s, z) count = 2 * weights / group_size, i.e. 202M at 64 vs 405M at 32.
  group_size: 32          # INT2 cell: g32

  # NOTE: qat.lsq is the *sqat_permute / full* switch. SALT-Q's salient segment is ALWAYS LSQ
  # (that is what makes its trained weights land on the grid), so this flag does not gate it.
  #
  # lsq.scales_lr is NOT a fourth independent knob in saltq mode: it is read only when
  # qat.saltq.scales_lr is absent (src/trainer.py). Keep it EQUAL to qat.saltq.scales_lr — a
  # different value here is dead config that silently becomes live the day someone deletes the
  # saltq key. Same per-bit law: 2e-5 / 1e-5 / 5e-6 at INT2 / INT3 / INT4.
  lsq:
    enabled: true
    scales_lr: 1.73e-5

  # Calibration data for BOTH offline stages (E[x^2] for saliency, and the GPTQ Hessian).
  # Read by src/data.load_calibration_data via cfg["qat"]["sqat"].
  sqat:
    calibration_samples: 3500
    calibration_sampling: balanced
    calibration_seq_len: 2048

  saltq:
    # ---- how the salient slice starts (see header): minmax = RTN pin (default), gptq = full-matrix OBS
    salient_init: gptq
    # ---- whether the salient slice gets full weight-space freedom at all --------------------
    # true (default) = full SALT-Q. columns [0:group_k) are nn.Parameter weights trained with
    #   LSQ fakequant; columns [group_k:) are frozen codes + trainable (s, z) (see train_scale
    #   below for whether s is one of them).
    # false = the "z-only everywhere" ablation (AGENTS.md §12 item 1 / §12's 段拆分消融 list:
    #   full SALT-Q / only-salient / only-z / Permuted SQAT). The salient slice is NOT trained as
    #   a weight at all: build_saltq_base folds its GPTQ-computed (codes, s, z) into the SAME
    #   frozen-codes + trainable-(s,z) pool the non-salient segment uses, so every layer is
    #   recorded with group_k=0 for training purposes. The offline PERMUTATION is unchanged
    #   (single-variable vs. the default run) — salient channels still get moved to the front and
    #   still get pinned to the canonical grid during GPTQ; only what gets left TRAINABLE differs.
    #   Every trainable degree of freedom in the model is then a (row, group) zero-point.
    train_salient: true

    # ---- what the non-salient segment is allowed to train -----------------------------------
    # false (default) = z-only. This is the configuration that makes SALT-Q cost the same as
    #   PSQAT/QLoRA. dL/dz is a UNIFORM sum over each quant group, so it collapses into a pooled
    #   input and costs 2N/g (~1.5% at g=64); and with s frozen, q*s is constant, so it is
    #   precomputed once and the forward is a frozen GEMM plus a pooled correction — no [out, in]
    #   weight is ever reconstructed in either direction.
    # true = also train s. dL/ds carries a per-element (q-z) factor that folds into neither
    #   operand, forcing the full [out, in] weight-gradient GEMM: +2N FLOPs, irreducible, and
    #   independent of how few scale parameters there are. It also forces the slow
    #   reconstruct-then-GEMM forward. Run this ONLY as the "is s worth it" ablation.
    train_scale: false

    # ---- how the zero-point is parameterized -------------------------------------------------
    # true (default) = FRACTIONAL zero-point. An integer-constrained z cannot be trained: z is
    #   measured in quantization LEVELS, so rounding puts a dead zone in front of it and the
    #   effective weight does not move until z crosses half a level. Measured on the first INT3
    #   g64 run, round(z) changed for 0 of 1.63M parameters and the non-salient segment
    #   contributed exactly nothing (32.9 GSM8k vs a 28.7 starting point, all of it from the
    #   salient segment). It is also what QA-LoRA actually deploys — its group-pooled delta folds
    #   in as z - c/s, which is not an integer — so integer z is strictly WEAKER than the baseline
    #   this segment is meant to generalize.
    #   Cost: the zero-point ships as fp16 metadata instead of packed int4, +16 bits per group
    #   (~0.25 bit/weight at g=64). The dense-dequant eval path is unaffected.
    # false = integer z, for the ablation. Needs zp_lr around 5e-3 to move at all.
    continuous_z: true

    # =========================================================================================
    # LEARNING RATES — derived, not guessed. Grouped by the UNITS each parameter lives in.
    # =========================================================================================
    # Under Adam the update is lr * m̂/(√v̂+ε), so a constant factor on the gradient CANCELS. That
    # means LSQ's 1/√(N·Qp) gradient scaling does NOT set the step size — only lr does. So the
    # only thing that matters is lr measured against the parameter's own natural unit. Mixing
    # units in one optimizer group is exactly how run1 trained nothing outside the salient
    # segment (round(z) changed for 0 of 1.63M params) and scored 32.9 instead of 44.8.
    #
    # ---- the two measured constants ---------------------------------------------------------
    # (1) DISPLACEMENT. Over one MetaMath epoch (T = 6584 optimizer steps, cosine + 3% warmup,
    #     max_grad_norm 0.3) the realized |Δparam| of the validated INT3 run was, in each group's
    #     own unit, lr * c with
    #             c ≈ 38   (median; p10 6, p90 100)   ≈ 0.47 * √T
    #     and c came out the SAME for all three groups — 35.5 for the salient weights, 40.1 for
    #     the LSQ scales, 38.8 for the zero-points — which is the empirical proof of the Adam
    #     argument above. c grows as √T, so a 2-epoch run wants every lr below multiplied by
    #     1/√2. (Measured off outputs/saltq-3bit-saltq/final vs the frozen base.)
    #
    # (2) GRID STEP. The min-max init makes the step exactly s(b) = range / (2^b − 1), so it is
    #     an exact 1/(2^b − 1) law — measured s2/s3 = 2.333 = 7/3 to four significant figures,
    #     for the salient and non-salient segments alike:
    #             median s   INT2 2.84e-2   INT3 1.22e-2   INT4 5.68e-3 (= INT3 * 7/15)
    #     |W_S| RMS is 1.9e-2, i.e. at INT2 one quantization step is larger than a typical weight.
    #
    # ---- what each group should move, and therefore its lr -----------------------------------
    # salient_lr  [WEIGHT units].  Target: |ΔW_S| ≈ 0.5 * s(b). Below ~0.1 s the codes never flip
    #   and the "full weight freedom" tier is fictitious (at 2e-5 the measured movement was
    #   0.03-0.14 s — that was run1's second bug); much above 1 s and the salient columns stop
    #   being a fine-tune of the pretrained weights. The validated run measured 0.58 s (p90 1.53).
    #       salient_lr = 0.5 * s(b) / c   ->   PROPORTIONAL TO 1/(2^b − 1)
    # scales_lr   [WEIGHT units].  The LSQ scale of the SALIENT segment only — with train_scale
    #   false the non-salient s is a frozen buffer, so this group is 2.5M params, not 202M.
    #   Target: a few percent of relative range movement (validated run: 3.3%, p90 9.6%).
    #       scales_lr = 0.03 * s(b) / c   ->   also PROPORTIONAL TO 1/(2^b − 1), = salient_lr/20
    # zp_lr       [QUANTIZATION-LEVEL units, where the meaningful step is 1.0, not 1e-2]. This is
    #   the entire freedom of the non-salient 98%. It does two jobs that scale OPPOSITELY:
    #     (a) re-centering the frozen grid against a quantization error of ±0.5 level — a
    #         LEVEL-units target, so bit-INDEPENDENT;
    #     (b) task adaptation of a fixed weight-units delta d, which needs |Δz| = d/s(b) levels,
    #         so it GROWS as (2^b − 1): at INT4 each level is worth 2.1x less weight than at INT3.
    #   Hence zp_lr = max(1e-3 floor from (a), 1e-3 * (2^b − 1)/7 from (b)) — flat at low bit,
    #   rising at INT4. Useful band for |Δz| is ~0.1-0.3 levels; past ~0.5 the shift stops being
    #   an error correction and just moves the group mean by half a step.
    #
    # ---- the resulting table (bold = measured, the rest is the law transported) ---------------
    #     bits | salient_lr | scales_lr |  zp_lr  | realized |ΔW_S| / |Δz|
    #     -----+------------+-----------+---------+---------------------------
    #       2  |   5.0e-4   |  2.0e-5   | 1.0e-3  | predicted 0.5 s / 0.04 lvl
    #       3  | **2.0e-4** | **1.0e-5**| **1e-3**| MEASURED 0.58 s / 0.039 lvl  -> 44.8 GSM8k
    #       4  |   1.0e-4   |  5.0e-6   | 2.0e-3  | predicted 0.5 s / 0.08 lvl
    #
    # KNOWN HEADROOM: zp_lr is the one knob the derivation says is under-driven. 1e-3 realized
    # only 0.039 levels, against a useful band of 0.1-0.3, i.e. z is currently correcting ~8% of
    # the ±0.5-level code error. zp_lr = 3e-3 (-> ~0.11 levels) is the highest-value sweep,
    # especially at INT2 where job (a) dominates. It is deliberately NOT applied to the first INT2
    # run so that run differs from the 44.8 INT3 run by the bit width alone.
    #
    # The *_by_bits maps below are what the code actually reads (resolved against
    # model.quant_bits); the scalar is the fallback and must stay equal to the INT3 entry. An
    # explicit --salient_lr / --saltq_scales_lr / --zp_lr on the command line beats both.
    salient_lr: 1.25e-4
    # THE SINGLE VARIABLE. See the header for the curve this point brackets.
    salient_lr_by_bits: {2: 1.25e-4, 3: 5.0e-5, 4: 2.5e-5}
    scales_lr: 1.0e-5
    scales_lr_by_bits: {2: 1.73e-5, 3: 1.73e-5, 4: 8.66e-6}    # x sqrt(3) for T=1845
    zp_lr: 1.73e-3
    # THE ONE CHANGED LINE. INT2: 1.0e-3 -> 5.0e-3 (predicted |Δz| 0.032 -> ~0.16 levels).
    # INT3/INT4 left alone so this file stays a drop-in for the other cells.
    zp_lr_by_bits:      {2: 3.46e-3, 3: 1.73e-3, 4: 3.46e-3}   # x sqrt(3) for T=1845
    # RMSNorm weights stay fp16 at deploy, so training them is free extra freedom. Off = the
    # clean "only the two segments are trained" ablation.
    train_layernorms: false

    # ---- permutation / saliency (identical semantics to qat.sqat_permute) -------------------
    # Mode switch:
    #   omit boundary_sizes and group_k  -> auto segments + auto per-segment group_k
    #   boundary_sizes only              -> manual segments + auto group_k
    #   group_k only                     -> auto segments + fixed group_k
    #   boundary_sizes + group_k + top_k_ratio -> legacy manual/fixed mode (used here, so the
    #                                             SALT-Q vs Permuted-SQAT comparison is
    #                                             single-variable: same permutation, same slice)
    # AUTO SEGMENTS + FIXED group_k — THE SINGLE VARIABLE OF THIS RUN.
    # boundary_sizes is ABSENT while group_k is SET, which is the combination that dispatches to
    # permute_common.auto_segment_with_fixed_group_k (see the resolution block: boundary_sizes is
    # None and fixed_group_k is not None). The DP then chooses only WHERE to cut, with every
    # segment forced to the same group_k, minimizing the outlier overflow that will not fit.
    #
    # This is the corrected version of the auto-segmentation experiment. The first attempt used
    # auto_segment_by_outliers, whose DP minimizes sum(layers * group_k) subject to capturing every
    # channel above a fixed z-score; it duly found a solution CHEAPER than legacy on the residual
    # budget (3936 vs 4096) that protected far less energy through the middle of the network
    # (per-segment energy coverage 82% / 51% / 35% / 24% with depth) and scored 36.69 against the
    # legacy 40.90. Holding group_k at 128 removes the cost-minimizing degree of freedom entirely:
    # the budget becomes exactly the legacy budget (32 * 128 = 4096), so this run answers the one
    # question the earlier one confounded — is the hand-set [2, 30] cut actually the right place to
    # cut, at equal cost?
    # boundary_sizes:  <auto>
    # ---- span_k256: DERIVED FROM saltq_cs170k_int2_g32_ep1_span.yaml (67.29 / 67.16 MEAN(8)) BY
    # group_k 128 -> 256 (plus output_dir). Same construction as the INT3 k-sweep
    # (saltq_cs170k_int3_ep1_k64 / _k256): the permuted base and the frozen INT2 codes are
    # REBUILT for this k (autoseg re-splits at k=256), so the run is "SALT-Q at k=256" under the
    # repo's own rule, not a re-labelling of the k=128 base.
    #
    # WHY 256. In the span cell's rank-ordered fp16-salient sweep (fig. mixedprec_int2_g32_span_
    # rank_mean8_share) k=256 is the knee: 44.6 (k=128) -> 49.2 (k=256) MEAN(8), and the probe's
    # answer-token loss drops 1.27 -> 1.15 there, the largest step of the curve. SALT-Q at
    # k=128 sits at 67.16 with zp_lr 1.73e-3 / salient_lr 1.25e-4, the lr peak bracketed on both
    # sides (0.5x 66.17, 2.5x 66.24 MEAN(7)); those lrs are kept. The salient tier doubles to
    # ~315M trainable weights at the same 2.00 deployed bits.
    #
    # READ against 67.16 (MEAN(8)) / 67.29 (MEAN(7)); k=256 costs nothing at deploy, so any gain
    # is free. Displacement should stay ~0.08 grid steps (same lr, same supervision).
    group_k: 256
    max_segments: 4
    top_k_ratio: 0.01

    # Log-space z-score threshold for residual q/k/v/gate/up segment outlier detection.
    outlier_log_sigma: 2.5
    # Separate threshold for per-layer down_proj group_k selection.
    down_outlier_log_sigma: 3

    # ---- frozen-code initialization ---------------------------------------------------------
    # GPTQ/OBS on the permuted fp16 base produces the integer codes that are then FROZEN FOREVER,
    # plus the initial (s, z). Run once, sequentially per decoder layer, in the permuted basis
    # with the boundary gathers active. Quality here matters more than in sqat_permute: (s, z)
    # cannot repair a badly chosen code.
    gptq:
      nsamples: 3500         # calibration sequences for the Hessian (= calibration_samples)
      percdamp: 0.01         # Hessian diagonal damping (fraction of mean diag)
      blocksize: 128         # GPTQ lazy-batch compute block (= 2 groups of 64). NOT the quant
                             # group; only has to be a multiple of group_size (auto-aligned).
      batch_size: 8          # calibration micro-batch

    # --- offline stages (run automatically by scripts/train.py on rank 0) --------------------
    #   1. <output_dir>/permuted_fp16_base   (~13 GB)  permute-before-quantize, shared with
    #                                                  sqat_permute; keep it for export-only
    #   2. <output_dir>/saltq_base           (~7 GB)   frozen int8 codes + (s0, z0) + salient init
    # BOTH must be reused on resume and on export: the codes are a discrete one-shot choice, so a
    # regenerated base makes every trained (s, z) and salient weight meaningless.

data:
  # Local pissa-dataset JSON: datasets/commonsense/{train,test}.json, records of
  # instruction / input / output / type covering BoolQ, PIQA, SIQA, ARC-e/c, HellaSwag,
  # WinoGrande and OBQA. Rendered through src/data.PROMPT with the loss on the RESPONSE
  # ONLY, which is what makes the trained model's output parseable by scripts/test_acc.py.
  train_dataset: "datasets/commonsense"
  train_split: "train"
  # No in-loop eval: the test split is scored GENERATIVELY (vLLM + exact-match) by
  # run_eval_vllm.sh, and a teacher-forced loss on it would not predict that score.
  val_split: null
  dataset_field: ["instruction", "output"]
  sub_task: null            # null = all 8 tasks; e.g. ["boolq", "piqa:2000"] to restrict
  shuffle_dataset: true
  num_proc: 32
  # ---- which span carries the loss (src/data.py LOSS_SPANS) ---------------------------------
  # DERIVED FROM configs/saltq_cs170k_int2_g32_ep1.yaml (the INT2 anchor, 65.77) BY THIS ONE KEY
  # plus output_dir. "response" is what every commonsense result before 2026-08-26 used.
  #
  # WHY. On commonsense-170k the response is one of 15 fixed strings, so under response-only
  # supervision the task is ONE informative token per record; the loss sits on the ~0.125
  # template plateau until an escape that at INT2 comes late (anchor 0.672, QA-LoRA 0.347)
  # or never (every run that kept an STE salient tier next to the adapter). MetaMath, whose
  # rationales give hundreds of supervised tokens per record, shows none of this at INT2 g32:
  # loss 2.4 -> 0.16 monotone, no plateau, no spikes, zp_lr 3x and salient_lr 4x higher
  # without blowing up, SALT-Q 37.7 = QA-LoRA 37.4 (best variant 40.9). This cell tests
  # whether dense supervision does the same for commonsense: mask only the fixed PROMPT
  # header and supervise question + options + response (100-300 real LM tokens; this is
  # LLM-Adapters' own train_on_inputs=True default). Eval is untouched -- the scorer regex-
  # extracts the first answer token from the generation, and the prompt is not generated.
  #
  # THIS IS A NEW EXPERIMENTAL CELL. Every baseline it is compared with (QA-LoRA first) must
  # be re-run with the same loss_span; nothing here is comparable to the response-only table.
  # The [Data] loss_span=... log line prints the supervised-token share: expect ~150-250 per
  # record here vs ~8 under "response". If it prints ~8, a stale tokenizer cache was used.
  loss_span: instruction+response


training:
  output_dir: "outputs/saltq_cs170k_int2_g32_ep1_span_k256_bcal_sgptq_zp2x"
  num_epochs: 1              # 3 -> 1; the lrs above carry the sqrt(3) compensation
  # 4 x RTX 6000 Ada (46 GB). At group_size=64 / group_k=128 on Llama-2-7B the resident cost per
  # GPU is roughly:
  #   frozen int8 codes            6.3 GB   (buffers; DDP broadcast is disabled for them)
  #   157M salient weights
  #   + 202M (s, z)  = 360M fp32   5.8 GB   (params + grads + AdamW moments)
  #   fp16 embed/norm/head         0.5 GB
  #   -> ~12.6 GB before activations (group_size=32 would add ~3.2 GB).
  # Each forward also rebuilds one [out, in] fp32 weight per projection; gradient checkpointing
  # bounds that to one decoder layer at a time.
  # 4 x 5 x 4 GPUs = effective batch 80. MUST stay 80 for this run: the comparison is against the
  # 36.1 INT2 g32 baseline, which ran at 80 (it moved from 3 to 4 GPUs without re-deriving the
  # batch). See the c-vs-eff_batch note in the lr block — eff_batch changes T, which changes c,
  # which changes every realized displacement. One variable at a time.
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 5
  # true -> false: THE single variable of this run. See the header.
  group_by_length: false
  # Base lr — only applies to the "other" param group (LayerNorms when train_layernorms=true).
  # The two segments use qat.saltq.salient_lr / qat.saltq.scales_lr.
  learning_rate: 2.0e-5
  weight_decay: 0.01
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  max_grad_norm: 0.3
  fp16: false
  bf16: true
  logging_steps: 10
  save_steps: 500
  save_total_limit: 1
  dataloader_num_workers: 4
  report_to: "wandb"
  seed: 42

export:
  merge_and_save: true
