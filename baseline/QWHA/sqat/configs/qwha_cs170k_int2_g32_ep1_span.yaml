# =============================================================================
# QWHA baseline — Commonsense-170k, INT2 g32, ONE epoch, span cell.
#
# METHOD (upstream, untouched): plain-GPTQ INT2 g32 asymmetric base (wikitext2, 128x2048,
# desc_act off, NO MagR — this repo's other rows sit on a plain GPTQ base), a Walsh-Hadamard
# adapter at the LoRA-r64 parameter budget rank*(in+out) per layer, AdaAlloc-initialized from the
# quantization error, adapter scaling 4000, only the spectrum trained.
#
# RECIPE (this repo): identical to configs/qalora_cs170k_int2_g32_ep1_span.yaml —
# datasets/commonsense, loss_span instruction+response, 1 epoch, effective batch 80 (5 x 4 x 4
# GPUs), cosine, warmup 0.03, wd 0.01, max_grad_norm 0.3, bf16, group_by_length false, seed 42.
#
# NOT matched, deliberately: learning_rate is QWHA's own. The paper (Table 9) has no Llama-2-7B
# row; 2e-5 is its Llama-3.1-8B / Alpaca value at 2 bits — instruction tuning, nearest model.
#
# Deployment note: unlike QA-LoRA and SALT-Q, a QWHA checkpoint is INT2 codes PLUS an fp16
# spectrum (~160M values, the r=64 budget) that has no lossless merge into 2-bit weights. Its
# row is "2 + fp16", not 2.
# =============================================================================
model:
  name: "meta-llama/Llama-2-7b-hf"
  quant_bits: 2
  max_seq_len: 2048

qwha:
  group_size: 32
  rank: 64                   # parameter budget: n_frequency = 64 * (in + out) per layer
  scale: 4000.0              # paper Table 8

data:
  train_dataset: "datasets/commonsense"
  train_split: "train"
  val_split: null
  dataset_field: ["instruction", "output"]
  sub_task: null
  shuffle_dataset: true
  loss_span: instruction+response
  num_proc: 32

training:
  output_dir: "outputs/qwha_cs170k_int2_g32_ep1_span"
  num_epochs: 1
  per_device_train_batch_size: 5
  gradient_accumulation_steps: 4
  group_by_length: false
  learning_rate: 2.0e-5
  weight_decay: 0.01
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  max_grad_norm: 0.3
  fp16: false
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  save_steps: 500
  save_total_limit: 1
  dataloader_num_workers: 4
  report_to: "none"
  seed: 42
