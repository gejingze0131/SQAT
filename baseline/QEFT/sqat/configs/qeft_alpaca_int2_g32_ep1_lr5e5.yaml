# =============================================================================
# QEFT (EMNLP 2024 Findings, arXiv:2410.08661) -- Alpaca column. INT2 g32 codes PLUS
# k=256 fp16 weak columns per linear (2.75 effective bits), and only those columns are
# trained. Read this row as "2 + fp16", never as a pure 2-bit row.
#
# lr 5e-5, not the paper's k-law 3.5e-6: on the INT3 commonsense cell the paper lr
# under-trained by ten points (66.73 -> 77.68 at 5e-5), and 5e-5 is what every other
# column in this table runs. It carries the same x0.9750 transport as every other arm.
#
# THE ALPACA COLUMN (Llama-2-7B, INT2 g32, MMLU 5-shot). Derived from the commonsense-170k INT2
# cell of the same method; the METHOD is untouched and four column properties change:
#   1. data.train_dataset  datasets/commonsense -> datasets/alpaca (alpaca-cleaned, 51,760
#                          records; `input` folded into the instruction by
#                          scripts/build_alpaca_dataset.py)
#   2. data.loss_span      instruction+response -> response. The span switch existed because a
#                          commonsense response is one of 15 fixed strings; an Alpaca response is
#                          free-form text, and response-only is what QLoRA reports for Alpaca.
#   3. calibration         balanced in-domain 3500 -> generic C4 128 x 2048, the GPTQ-paper
#                          recipe, identical for every arm of this column.
#   4. num_epochs 1 -> 3, and every lr x sqrt(T_ref / T_here) = sqrt(1845 / 1941) = 0.9750.
#                          51,760 / 80 = 647 steps per epoch, x3 = T 1941 against the reference
#                          cell's 1845. 3 epochs is the Alpaca convention (Stanford Alpaca,
#                          QLoRA, QA-LoRA) and it is what puts T within 5% of the validated cell.
#
# Scored on MMLU 5-shot through lm-eval-harness: runs/eval_vllm.sh --dataset alpaca dispatches to
# scripts/eval_mmlu.py (no vLLM, no test split -- MMLU shares nothing with the training set).
#
# 1-EPOCH CONTROL of the Alpaca column. Derived from the 3-epoch config by exactly three things:
# training.num_epochs, training.output_dir and the learning rates, each multiplied by
# sqrt(T_3ep / T_1ep) = sqrt(1941 / 647) = sqrt(3) = 1.7321.
#
# WHY. On MMLU -- a benchmark the fine-tuning set never touches -- the 3-epoch cell has SALT-Q
# reaching the LOWEST training loss of any arm (0.656, below even the 16-bit QLoRA arm's 0.822)
# and the second-best MMLU (32.77 against QEFT's 34.25). That is the T2e/T2f WikiText-2 pattern:
# the arm with the most trainable freedom fits the fine-tuning distribution hardest and drifts
# furthest from the pretrained model, which costs it on a retention metric. This cell tests it:
# if the drift is what costs the points, one epoch should RAISE MMLU.
#
# The bases are REUSED, not rebuilt, so this differs from the 3-epoch run by the epoch count
# alone.
# =============================================================================

model:
  name: "meta-llama/Llama-2-7b-hf"
  quant_bits: 2
  dtype: "bfloat16"
  max_seq_len: 2048

qeft:
  k: 256                  # weak columns per linear; must be a multiple of group_size
  group_size: 32
  base_dir: "outputs/qeft_bases/Llama-2-7B_int2_g32_k256_asym_c4cal"
  oproj_weak: true
  targets: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

qat:
  symmetric: false
  sqat:
    # C4 128 x 2048 = 262,144 tokens, the GPTQ-paper budget, from datasets/c4_calib_1024.json.
    # calibration_source switches src/data.load_calibration_data to the generic-text path (raw
    # strings joined with EOS, cut into calibration_seq_len windows, no PROMPT and no masking);
    # calibration_sampling is dead config there and is kept only to show which knob is NOT live.
    # EVERY arm of the Alpaca column calibrates on these same 128 windows.
    calibration_samples: 128
    calibration_sampling: balanced
    calibration_seq_len: 2048
    calibration_source: "datasets/c4_calib_1024.json"
  gptq:
    nsamples: 128                  # MUST equal calibration_samples
    percdamp: 0.01
    blocksize: 128
    batch_size: 8

data:
  train_dataset: "datasets/alpaca"
  train_split: "train"
  val_split: null
  dataset_field: ["instruction", "output"]
  sub_task: null
  shuffle_dataset: true
  loss_span: response
  num_proc: 32

training:
  output_dir: "outputs/qeft_alpaca_int2_g32_ep1_lr5e5"
  num_epochs: 1
  per_device_train_batch_size: 5
  gradient_accumulation_steps: 4      # x per_device 5 x 4 GPUs = effective batch 80
  group_by_length: false
  learning_rate: 8.45e-5           # the 3-epoch cell's 4.88e-5 x sqrt(3) for T=647
  weight_decay: 0.01
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  max_grad_norm: 0.3
  fp16: false
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  save_steps: 500
  save_total_limit: 1
  dataloader_num_workers: 4
  report_to: "none"
  seed: 42
